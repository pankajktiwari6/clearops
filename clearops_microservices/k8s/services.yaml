apiVersion: apps/v1
kind: Deployment
metadata: {name: gateway}
spec:
  replicas: 2
  selector: {matchLabels: {app: gateway}}
  template:
    metadata: {labels: {app: gateway}}
    spec:
      containers:
      - name: gateway
        image: ${ACR}/clearops-gateway:${TAG}
        ports: [{containerPort: 8000}]
        env:
        - {name: SETUP_SERVICE_URL, value: "http://setup-service"}
        - {name: TIMEPLANNER_SERVICE_URL, value: "http://timeplanner-service"}
        - {name: PROJECT_SERVICE_URL, value: "http://project-service"}
        - {name: ADMIN_SERVICE_URL, value: "http://admin-service"}
        - {name: AUTH_ENABLED, value: "true"}
        - name: REDIS_URL
          valueFrom: {secretKeyRef: {name: clearops-secrets, key: redis-url}}
        - name: AAD_TENANT_ID
          valueFrom: {secretKeyRef: {name: clearops-secrets, key: aad-tenant-id}}
        - name: AAD_CLIENT_ID
          valueFrom: {secretKeyRef: {name: clearops-secrets, key: aad-client-id}}
        - name: APPLICATIONINSIGHTS_CONNECTION_STRING
          valueFrom: {secretKeyRef: {name: clearops-secrets, key: appinsights-connection-string}}
        readinessProbe: {httpGet: {path: /health, port: 8000}}
        livenessProbe: {httpGet: {path: /health, port: 8000}}
---
apiVersion: v1
kind: Service
metadata: {name: gateway}
spec:
  selector: {app: gateway}
  ports: [{port: 80, targetPort: 8000}]
---
