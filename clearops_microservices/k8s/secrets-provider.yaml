# Syncs secrets from Azure Key Vault into the `clearops-secrets` Kubernetes secret
# via the Secrets Store CSI driver (reached through Private Endpoint inside the VNet).
# Mount this class in each pod (volume `csi`) so the secret objects get created.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata: {name: clearops-keyvault}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: ${KV_IDENTITY_CLIENT_ID}
    keyvaultName: ${KEY_VAULT_NAME}
    tenantId: ${AAD_TENANT_ID}
    objects: |
      array:
        - {objectName: database-url, objectType: secret}
        - {objectName: redis-url, objectType: secret}
        - {objectName: aad-tenant-id, objectType: secret}
        - {objectName: aad-client-id, objectType: secret}
        - {objectName: appinsights-connection-string, objectType: secret}
  secretObjects:
  - secretName: clearops-secrets
    type: Opaque
    data:
    - {objectName: database-url, key: database-url}
    - {objectName: redis-url, key: redis-url}
    - {objectName: aad-tenant-id, key: aad-tenant-id}
    - {objectName: aad-client-id, key: aad-client-id}
    - {objectName: appinsights-connection-string, key: appinsights-connection-string}
