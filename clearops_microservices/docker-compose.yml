services:
  gateway:
    build: ./gateway
    ports: ["8000:8000"]
    environment:
      USER_SERVICE_URL: http://user-service:8001
      ORDER_SERVICE_URL: http://order-service:8002
    depends_on: [user-service, order-service]
  user-service:
    build: ./user_service
    expose: ["8001"]
  order-service:
    build: ./order_service
    environment:
      USER_SERVICE_URL: http://user-service:8001
    expose: ["8002"]
    depends_on: [user-service]
